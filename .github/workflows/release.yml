name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract release notes and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Extract the current version's section from the committed CHANGELOG.md
          node -e "
            const fs = require('fs');
            const log = fs.readFileSync('CHANGELOG.md', 'utf-8');
            const tag = process.env.TAG_NAME;
            const sections = log.split(/^(?=##? \[)/m);
            const current = sections.find(s => s.includes(tag));
            if (current) {
              // Remove the heading line, keep only the body
              const body = current.replace(/^##? .+\n+/, '').trim();
              fs.writeFileSync('_RELEASE_NOTES.md', body);
            } else {
              fs.writeFileSync('_RELEASE_NOTES.md', '');
            }
          "
          # Created as a DRAFT deliberately. The platform builds below upload into
          # it, and finalize-release publishes it only once every platform has
          # succeeded. Publishing up front is what let v1.0.3 and v1.1.0 go out
          # with no Windows installer at all: the release was already public
          # before the Windows job failed, so a partial release looked like a
          # finished one.
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file _RELEASE_NOTES.md \
            --draft

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-args: --win
          - os: macos-latest
            build-args: --mac
          - os: ubuntu-latest
            build-args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A macOS build with no CoreWLAN binary still packages and still launches,
      # it just silently loses every BSSID — so nothing downstream would catch
      # it. v1.1.0 shipped exactly that way. Fail the release instead.
      - name: Verify CoreWLAN addon built
        if: runner.os == 'macOS'
        run: |
          node -e "
          const m = require('clarity-corewlan').load()
          if (!m) {
            console.error('CoreWLAN addon missing — a macOS release without it has no BSSID support.')
            console.error('The postinstall (scripts/build-native.js) should have compiled it.')
            process.exit(1)
          }
          console.log('CoreWLAN addon OK')
          "

      - name: Default code signing config
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_CERTIFICATE_P12" ] || [ -z "$MAC_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple signing/notarization secrets not configured — shipping an ad-hoc signed build. Users must approve Clarity once in System Settings > Privacy & Security (see README, 'Installing on macOS'). Add the secrets from SIGNING.md to switch to clean, Gatekeeper-approved installs."
            exit 0
          fi
          {
            echo "CSC_LINK=$MAC_CERTIFICATE_P12"
            echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            echo "DEBUG=electron-notarize*"
          } >> "$GITHUB_ENV"

      - name: Verify SignPath Foundation configuration
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          if [ -z "$SIGNPATH_API_TOKEN" ] || [ -z "$SIGNPATH_ORGANIZATION_ID" ] || [ -z "$SIGNPATH_PROJECT_SLUG" ] || [ -z "$SIGNPATH_SIGNING_POLICY_SLUG" ] || [ -z "$SIGNPATH_ARTIFACT_CONFIGURATION_SLUG" ]; then
            if [ "${ALLOW_UNSIGNED_WINDOWS}" = "true" ]; then
              echo "::warning::SignPath is not configured and ALLOW_UNSIGNED_WINDOWS is set — this release will ship an UNSIGNED Windows installer. SmartScreen will warn users on install."
              exit 0
            fi
            echo "::error::SignPath Foundation signing not configured (SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG). Refusing to release an unsigned installer — SmartScreen would flag it. See WINDOWS_SIGNING.md."
            exit 1
          fi

      # Reachability preflight, before the ~20 minute build rather than after it.
      #
      # The signing action reports every failure as "Could not authorize against
      # SignPath API", including a plain 503 from the connector. That one line
      # sent an investigation towards expired tokens when the real answer was a
      # server response, so probe the connector here and print the status code
      # verbatim. No credentials are sent: an unauthenticated request is enough
      # to tell "service answering" from "service unavailable".
      - name: Preflight SignPath connector
        if: runner.os == 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            https://githubactions.connectors.signpath.io/ || echo "000")
          echo "SignPath GitHub Actions connector responded: HTTP ${code}"
          case "$code" in
            000) echo "::warning::Connector unreachable from this runner (DNS/network/timeout)." ;;
            401|403) echo "Connector is up and rejecting unauthenticated probes — expected, credentials are checked at submit time." ;;
            503) echo "::warning::Connector returned 503 Service Unavailable. Signing will fail. Either SignPath is degraded (check https://about.signpath.io/status) or the GitHub.com trusted build system is not added to the organisation and linked to project '${{ vars.SIGNPATH_PROJECT_SLUG }}'. See docs.signpath.io/trusted-build-systems/github." ;;
            *) echo "Connector reachable (HTTP ${code})." ;;
          esac

      - name: Build, package, and upload (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          npx electron-vite build
          npx electron-builder ${{ matrix.build-args }} --publish always

      - name: Build Windows package (unsigned)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          npx electron-vite build
          npx electron-builder ${{ matrix.build-args }} --publish never

      - name: Get version from tag
        if: runner.os == 'Windows'
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer for signing
        if: runner.os == 'Windows'
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist-prod/Clarity-Setup-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error

      # `id` so the publish step below can tell whether a signed binary exists.
      # continue-on-error only when the unsigned escape hatch is deliberately
      # enabled; with signing required (the default) a failure here still fails
      # the job, the draft is never published, and no partial release goes out.
      - name: Submit signing request to SignPath Foundation
        id: signpath
        if: runner.os == 'Windows'
        continue-on-error: ${{ vars.ALLOW_UNSIGNED_WINDOWS == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Publish Windows installer to release
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_OUTCOME: ${{ steps.signpath.outcome }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          exe="Clarity-Setup-${VERSION}.exe"

          # Pick the binary to ship. Signed when SignPath returned one; otherwise
          # the unsigned build, but only when that was an explicit choice.
          if [ -f "signed-installer/${exe}" ]; then
            signed="signed-installer/${exe}"
          elif [ -n "$(ls signed-installer/*.exe 2>/dev/null || true)" ]; then
            # SignPath names the output per its artifact configuration, so accept
            # any .exe it returned and normalise it to the canonical name.
            signed="$(ls signed-installer/*.exe 2>/dev/null | head -n1)"
            echo "Using signed file name '$signed' (artifact configuration returned a different name than $exe)."
          elif [ "${ALLOW_UNSIGNED_WINDOWS}" = "true" ]; then
            echo "::warning::Signing did not produce a binary (outcome: ${SIGNING_OUTCOME}). Publishing the UNSIGNED installer because ALLOW_UNSIGNED_WINDOWS is set. SmartScreen will warn users on install."
            signed=""
          else
            echo "::error::SignPath did not return a signed ${exe} in signed-installer/ — files found: $(ls signed-installer/ 2>/dev/null || echo none)"
            exit 1
          fi
          [ -n "$signed" ] && cp "$signed" "dist-prod/${exe}"

          if [ ! -f "dist-prod/${exe}" ]; then
            echo "::error::No installer at dist-prod/${exe} to publish."
            exit 1
          fi

          # latest.yml is generated here, for whichever binary is actually being
          # published, and no longer only on the signing-success path. It is what
          # drives Windows auto-update, and tying it to signing meant a signing
          # failure silently disabled updates for every existing Windows user —
          # which is exactly the state v1.1.0 shipped in. Signing also rewrites
          # the binary, so electron-builder's own sha512 is stale either way.
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const v = process.env.VERSION;
            const exe = 'Clarity-Setup-' + v + '.exe';
            const data = fs.readFileSync('dist-prod/' + exe);
            const sha512 = crypto.createHash('sha512').update(data).digest('base64');
            const yml = [
              'version: ' + v,
              'files:',
              '  - url: ' + exe,
              '    sha512: ' + sha512,
              '    size: ' + data.length,
              'path: ' + exe,
              'sha512: ' + sha512,
              'releaseDate: ' + JSON.stringify(new Date().toISOString()),
              ''
            ].join('\n');
            fs.writeFileSync('dist-prod/latest.yml', yml);
          "
          gh release upload "$GITHUB_REF_NAME" "dist-prod/${exe}" "dist-prod/latest.yml" --clobber

  # ─────────────────────────────────────────────────────────────────────────────
  # The release is published here and nowhere else.
  #
  # Every platform uploads into a draft; this job flips it to public only after
  # all three legs have succeeded, and asserts the expected assets are actually
  # attached before doing so. Previously the release was created public up front,
  # so a failed Windows job produced a finished-looking release with no Windows
  # installer — that is how v1.0.3 and v1.1.0 both shipped without one, unnoticed
  # for two releases. A failure now leaves an unpublished draft instead, which is
  # invisible to users and trivially resumable by re-running the failed job.
  # ─────────────────────────────────────────────────────────────────────────────
  finalize-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify every platform shipped, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"

          assets=$(gh release view "$TAG_NAME" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Attached assets:"; echo "$assets" | sed 's/^/  /'

          # One representative artifact per platform, plus the update metadata
          # each platform's updater reads. Missing metadata is as bad as a missing
          # installer: it silently strands existing users on the old version.
          missing=""
          for required in \
            "Clarity-Setup-${version}.exe" \
            "latest.yml" \
            "Clarity-${version}-prod-x64.dmg" \
            "Clarity-${version}-prod-arm64.dmg" \
            "latest-mac.yml" \
            "Clarity-${version}-prod-x86_64.AppImage" \
            "Clarity-${version}-prod-amd64.deb" \
            "latest-linux.yml"
          do
            echo "$assets" | grep -qxF "$required" || missing="${missing}\n  - ${required}"
          done

          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish ${TAG_NAME} — the draft is missing:$(printf "$missing")"
            echo "The draft release has been left unpublished. Fix the failing platform, re-run it, then re-run this job."
            exit 1
          fi

          gh release edit "$TAG_NAME" --repo "$REPO" --draft=false
          echo "Published ${TAG_NAME} with all platforms present."

  publish-choco:
    needs: finalize-release
    if: ${{ vars.PUBLISH_CHOCO == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download installer and compute checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/CaptainHacX/Clarity/releases/download/v$version/Clarity-Setup-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile "Clarity-Setup-$version.exe"
          $hash = (Get-FileHash "Clarity-Setup-$version.exe" -Algorithm SHA256).Hash
          echo "CHECKSUM=$hash" >> $env:GITHUB_ENV

      - name: Update choco package files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $nuspec = Get-Content choco/clarity.nuspec -Raw
          $nuspec = $nuspec -replace '<version>.+?</version>', "<version>$version</version>"
          $nuspec = $nuspec -replace 'tag/v.+?"', "tag/v$version`""
          Set-Content choco/clarity.nuspec $nuspec

          $install = Get-Content choco/tools/chocolateyinstall.ps1 -Raw
          $install = $install -replace "\`$version = '.+?'", "`$version = '$version'"
          $install = $install -replace '__REPLACE_WITH_SHA256_HASH__|[A-Fa-f0-9]{64}', $env:CHECKSUM
          Set-Content choco/tools/chocolateyinstall.ps1 $install

      - name: Pack and push to Chocolatey
        shell: pwsh
        run: |
          choco pack choco/clarity.nuspec --out .
          choco push clarity.${{ steps.version.outputs.version }}.nupkg --source "https://push.chocolatey.org/" --api-key "${{ secrets.CHOCOLATEY_API_KEY }}"

  virustotal-scan:
    needs: finalize-release
    if: ${{ vars.PUBLISH_VIRUSTOTAL == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release download "v$version" --repo CaptainHacX/Clarity --pattern "Clarity-Setup-*.exe" --pattern "Clarity-*.dmg" --pattern "Clarity-*.AppImage" --pattern "Clarity-*.deb" --dir artifacts/

      - name: Scan with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          results=""
          for file in artifacts/*; do
            filename=$(basename "$file")
            filesize=$(stat -c%s "$file")
            echo "Uploading $filename ($filesize bytes) to VirusTotal..."

            if [ "$filesize" -gt 33554432 ]; then
              # Files > 32MB need the large-file upload URL
              echo "  Using large-file upload flow..."
              upload_url=$(curl -s --request GET \
                --url "https://www.virustotal.com/api/v3/files/upload_url" \
                --header "x-apikey: $VT_API_KEY" | jq -r '.data')
            else
              upload_url="https://www.virustotal.com/api/v3/files"
            fi

            response=$(curl -s --request POST \
              --url "$upload_url" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file")
            analysis_id=$(echo "$response" | jq -r '.data.id')
            if [ "$analysis_id" != "null" ] && [ -n "$analysis_id" ]; then
              echo "  Analysis ID: $analysis_id"
              results="$results- **$filename**: https://www.virustotal.com/gui/file-analysis/$analysis_id\n"
            else
              echo "  Failed to upload: $response"
              results="$results- **$filename**: upload failed\n"
            fi
            # VirusTotal free API rate limit: 4 requests/minute
            sleep 20
          done

          echo "## VirusTotal Scan Results" > vt_report.md
          echo "" >> vt_report.md
          echo -e "$results" >> vt_report.md

      - name: Append scan results to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          existing=$(gh release view "v$version" --repo CaptainHacX/Clarity --json body -q .body)
          vt_report=$(cat vt_report.md)
          gh release edit "v$version" --repo CaptainHacX/Clarity --notes "${existing}

          ${vt_report}"

  publish-winget:
    needs: finalize-release
    if: ${{ vars.PUBLISH_WINGET == 'true' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync winget-pkgs fork with upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
        run: |
          fork_owner=$(gh api user -q .login)
          gh repo sync "$fork_owner/winget-pkgs" --source microsoft/winget-pkgs --force

      - name: Update winget manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/CaptainHacX/Clarity/releases/download/v$version/Clarity-Setup-$version.exe"
          $releaseNotesUrl = "https://github.com/CaptainHacX/Clarity/releases/tag/v$version"
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe update AdventDevelopmentInc.Clarity --submit --token "${{ secrets.WINGET_GH_TOKEN }}" --urls "$url|x64|machine" --version $version --release-notes-url $releaseNotesUrl
