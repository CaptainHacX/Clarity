name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract release notes and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Extract the current version's section from the committed CHANGELOG.md
          node -e "
            const fs = require('fs');
            const log = fs.readFileSync('CHANGELOG.md', 'utf-8');
            const tag = process.env.TAG_NAME;
            const sections = log.split(/^(?=##? \[)/m);
            const current = sections.find(s => s.includes(tag));
            if (current) {
              // Remove the heading line, keep only the body
              const body = current.replace(/^##? .+\n+/, '').trim();
              fs.writeFileSync('_RELEASE_NOTES.md', body);
            } else {
              fs.writeFileSync('_RELEASE_NOTES.md', '');
            }
          "
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file _RELEASE_NOTES.md

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-args: --win
          - os: macos-latest
            build-args: --mac
          - os: ubuntu-latest
            build-args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Default code signing config
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_CERTIFICATE_P12" ] || [ -z "$MAC_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple signing/notarization secrets not configured — shipping an ad-hoc signed build. Users must approve Clarity once in System Settings > Privacy & Security (see README, 'Installing on macOS'). Add the secrets from SIGNING.md to switch to clean, Gatekeeper-approved installs."
            exit 0
          fi
          {
            echo "CSC_LINK=$MAC_CERTIFICATE_P12"
            echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            echo "DEBUG=electron-notarize*"
          } >> "$GITHUB_ENV"

      - name: Verify SignPath Foundation configuration
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if [ -z "$SIGNPATH_API_TOKEN" ] || [ -z "$SIGNPATH_ORGANIZATION_ID" ] || [ -z "$SIGNPATH_PROJECT_SLUG" ] || [ -z "$SIGNPATH_SIGNING_POLICY_SLUG" ] || [ -z "$SIGNPATH_ARTIFACT_CONFIGURATION_SLUG" ]; then
            echo "::error::SignPath Foundation signing not configured (SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG). Refusing to release an unsigned installer — SmartScreen would flag it. See WINDOWS_SIGNING.md."
            exit 1
          fi

      - name: Build, package, and upload (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          npx electron-vite build
          npx electron-builder ${{ matrix.build-args }} --publish always

      - name: Build Windows package (unsigned)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          npx electron-vite build
          npx electron-builder ${{ matrix.build-args }} --publish never

      - name: Get version from tag
        if: runner.os == 'Windows'
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer for signing
        if: runner.os == 'Windows'
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist-prod/Clarity-Setup-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error

      - name: Submit signing request to SignPath Foundation
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Publish signed installer to release
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          exe="Clarity-Setup-${VERSION}.exe"
          # SignPath may name the signed file per its artifact configuration, so fall
          # back to any .exe it returned and normalize it to the canonical name.
          if [ -f "signed-installer/${exe}" ]; then
            signed="signed-installer/${exe}"
          elif [ -n "$(ls signed-installer/*.exe 2>/dev/null || true)" ]; then
            signed="$(ls signed-installer/*.exe 2>/dev/null | head -n1)"
            echo "Using signed file name '$signed' (artifact configuration returned a different name than $exe)."
          else
            echo "::error::SignPath did not return a signed ${exe} in signed-installer/ — files found: $(ls signed-installer/ 2>/dev/null || echo none)"
            exit 1
          fi
          cp "$signed" "dist-prod/${exe}"
          # Signing rewrites the binary, so the sha512 electron-builder recorded in
          # latest.yml for the unsigned build is stale. Regenerate it for the signed file.
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const v = process.env.VERSION;
            const exe = 'Clarity-Setup-' + v + '.exe';
            const data = fs.readFileSync('dist-prod/' + exe);
            const sha512 = crypto.createHash('sha512').update(data).digest('base64');
            const yml = [
              'version: ' + v,
              'files:',
              '  - url: ' + exe,
              '    sha512: ' + sha512,
              '    size: ' + data.length,
              'path: ' + exe,
              'sha512: ' + sha512,
              'releaseDate: ' + JSON.stringify(new Date().toISOString()),
              ''
            ].join('\n');
            fs.writeFileSync('dist-prod/latest.yml', yml);
          "
          gh release upload "$GITHUB_REF_NAME" "dist-prod/${exe}" "dist-prod/latest.yml" --clobber

  publish-choco:
    needs: build
    if: ${{ vars.PUBLISH_CHOCO == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download installer and compute checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/CaptainHacX/Clarity/releases/download/v$version/Clarity-Setup-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile "Clarity-Setup-$version.exe"
          $hash = (Get-FileHash "Clarity-Setup-$version.exe" -Algorithm SHA256).Hash
          echo "CHECKSUM=$hash" >> $env:GITHUB_ENV

      - name: Update choco package files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $nuspec = Get-Content choco/clarity.nuspec -Raw
          $nuspec = $nuspec -replace '<version>.+?</version>', "<version>$version</version>"
          $nuspec = $nuspec -replace 'tag/v.+?"', "tag/v$version`""
          Set-Content choco/clarity.nuspec $nuspec

          $install = Get-Content choco/tools/chocolateyinstall.ps1 -Raw
          $install = $install -replace "\`$version = '.+?'", "`$version = '$version'"
          $install = $install -replace '__REPLACE_WITH_SHA256_HASH__|[A-Fa-f0-9]{64}', $env:CHECKSUM
          Set-Content choco/tools/chocolateyinstall.ps1 $install

      - name: Pack and push to Chocolatey
        shell: pwsh
        run: |
          choco pack choco/clarity.nuspec --out .
          choco push clarity.${{ steps.version.outputs.version }}.nupkg --source "https://push.chocolatey.org/" --api-key "${{ secrets.CHOCOLATEY_API_KEY }}"

  virustotal-scan:
    needs: build
    if: ${{ vars.PUBLISH_VIRUSTOTAL == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release download "v$version" --repo CaptainHacX/Clarity --pattern "Clarity-Setup-*.exe" --pattern "Clarity-*.dmg" --pattern "Clarity-*.AppImage" --pattern "Clarity-*.deb" --dir artifacts/

      - name: Scan with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          results=""
          for file in artifacts/*; do
            filename=$(basename "$file")
            filesize=$(stat -c%s "$file")
            echo "Uploading $filename ($filesize bytes) to VirusTotal..."

            if [ "$filesize" -gt 33554432 ]; then
              # Files > 32MB need the large-file upload URL
              echo "  Using large-file upload flow..."
              upload_url=$(curl -s --request GET \
                --url "https://www.virustotal.com/api/v3/files/upload_url" \
                --header "x-apikey: $VT_API_KEY" | jq -r '.data')
            else
              upload_url="https://www.virustotal.com/api/v3/files"
            fi

            response=$(curl -s --request POST \
              --url "$upload_url" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file")
            analysis_id=$(echo "$response" | jq -r '.data.id')
            if [ "$analysis_id" != "null" ] && [ -n "$analysis_id" ]; then
              echo "  Analysis ID: $analysis_id"
              results="$results- **$filename**: https://www.virustotal.com/gui/file-analysis/$analysis_id\n"
            else
              echo "  Failed to upload: $response"
              results="$results- **$filename**: upload failed\n"
            fi
            # VirusTotal free API rate limit: 4 requests/minute
            sleep 20
          done

          echo "## VirusTotal Scan Results" > vt_report.md
          echo "" >> vt_report.md
          echo -e "$results" >> vt_report.md

      - name: Append scan results to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          existing=$(gh release view "v$version" --repo CaptainHacX/Clarity --json body -q .body)
          vt_report=$(cat vt_report.md)
          gh release edit "v$version" --repo CaptainHacX/Clarity --notes "${existing}

          ${vt_report}"

  publish-winget:
    needs: build
    if: ${{ vars.PUBLISH_WINGET == 'true' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync winget-pkgs fork with upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
        run: |
          fork_owner=$(gh api user -q .login)
          gh repo sync "$fork_owner/winget-pkgs" --source microsoft/winget-pkgs --force

      - name: Update winget manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/CaptainHacX/Clarity/releases/download/v$version/Clarity-Setup-$version.exe"
          $releaseNotesUrl = "https://github.com/CaptainHacX/Clarity/releases/tag/v$version"
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe update AdventDevelopmentInc.Clarity --submit --token "${{ secrets.WINGET_GH_TOKEN }}" --urls "$url|x64|machine" --version $version --release-notes-url $releaseNotesUrl
