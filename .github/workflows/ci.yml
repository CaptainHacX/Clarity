name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS-only native addon. `npm ci` builds it via its gypfile; this proves
      # the binary is actually present on macOS rather than silently skipped,
      # since it is an optionalDependency and a build failure would not fail the
      # install. On Windows/Linux the package deliberately produces no binary.
      - name: Verify CoreWLAN addon built
        if: runner.os == 'macOS'
        run: node -e "const m=require('clarity-corewlan').load(); if(!m) { console.error('CoreWLAN addon missing — BSSIDs would be unavailable on macOS'); process.exit(1) } console.log('CoreWLAN addon OK')"

      - name: Validate cleaner rules
        run: npm run validate:rules

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: bash scripts/cli-smoke-test.sh
        timeout-minutes: 5
